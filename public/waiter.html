<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<title>nota. — Ospătar</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300333c'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23C5A059' text-anchor='middle'%3En.%3C/text%3E%3C/svg%3E">

<!-- PWA -->
<link rel="manifest" href="/waiter-manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ospătar">
<meta name="mobile-web-app-capable" content="yes">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:      #0A0A0A;
  --card:    #1A1A1A;
  --surface: #202020;
  --border:  #2A2A2A;
  --text:    #F0F0F0;
  --text2:   #A3A3A3;
  --muted:   #737373;
  --em:      #10B981;
  --em-hi:   #4EDEA3;
  --em-bg:   rgba(16,185,129,.14);
  --amber:   #D97706;
  --amber-hi:#F59E0B;
  --amber-bg:rgba(217,119,6,.16);
  --red:     #EF4444;
  --red-hi:  #FF6B6B;
  --red-bg:  rgba(239,68,68,.16);
  --r:  10px;
  --rl: 16px;
}

html, body {
  height: 100%;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button { font-family: inherit; }

/* ── Top bar ─────────────────────────────────────────── */
#topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
#tb-title { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }
#tb-restaurant { font-size: 11px; color: var(--muted); }
#tb-actions { margin-left: auto; display: flex; gap: 6px; }
.tb-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-size: 16px; padding: 8px 10px; cursor: pointer;
  min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center;
}
.tb-btn.active-mute { color: var(--red); border-color: rgba(239,68,68,.3); }

/* ── Disconnected banner — persistent, never a fading toast ────────── */
#conn-banner {
  display: none;
  background: var(--red-bg); color: var(--red-hi);
  border-bottom: 1px solid rgba(239,68,68,.3);
  font-size: 13px; font-weight: 700; text-align: center;
  padding: 8px 12px;
}
#conn-banner.show { display: block; }

/* ── Start / PIN screen ──────────────────────────────── */
#start-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; gap: 18px; text-align: center;
}
#start-logo { font-family: Georgia, serif; font-weight: 700; font-size: 34px; color: var(--em-hi); }
#start-msg { font-size: 14px; color: var(--text2); max-width: 320px; line-height: 1.5; }
#pin-input {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
  color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: 0.4em;
  text-align: center; padding: 14px 10px; width: 220px; outline: none;
}
#pin-input:focus { border-color: var(--em); }
.big-btn {
  background: var(--em); border: none; border-radius: var(--r);
  color: #06231a; font-size: 16px; font-weight: 800; padding: 14px 28px;
  cursor: pointer; min-height: 52px; min-width: 180px;
}
.big-btn:active { transform: scale(0.98); }
#start-error { color: var(--red-hi); font-size: 13px; font-weight: 600; min-height: 18px; }

/* ── Grid ────────────────────────────────────────────── */
#grid-screen { display: none; padding: 14px; padding-bottom: 40px; }
#grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; margin-top: 10px;
}
.tcard {
  border-radius: var(--rl); padding: 16px 14px; min-height: 118px;
  display: flex; flex-direction: column; justify-content: space-between;
  border: 1px solid var(--border); background: var(--card);
  position: relative; overflow: hidden;
}
.tcard .t-num { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.tcard .t-label { font-size: 13px; font-weight: 700; margin-top: 4px; }
.tcard .t-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.tcard.free    { opacity: 0.55; }
.tcard.occupied { border-color: rgba(217,119,6,.35); background: var(--amber-bg); }
.tcard.occupied .t-label { color: var(--amber-hi); }
.tcard.paying  { border-color: rgba(59,130,246,.4); background: rgba(59,130,246,.14); }
.tcard.paying  .t-label { color: #60a5fa; }
.tcard.paid    { border-color: rgba(16,185,129,.4); background: var(--em-bg); }
.tcard.paid    .t-label { color: var(--em-hi); }

.tcard.call {
  border-color: rgba(239,68,68,.6); background: var(--red-bg);
  animation: pulse-card 1.1s ease-in-out infinite;
}
.tcard.call .t-label { color: var(--red-hi); }
@keyframes pulse-card {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50%      { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}
.ack-btn {
  margin-top: 8px; background: var(--red); border: none; border-radius: 8px;
  color: #fff; font-size: 13px; font-weight: 800; padding: 10px 8px;
  cursor: pointer; min-height: 44px; width: 100%;
}
.ack-btn:active { transform: scale(0.97); }

#empty-state { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }

/* ── Wake lock note ──────────────────────────────────── */
#wakelock-note {
  display: none; text-align: center; font-size: 11px; color: var(--muted);
  padding: 10px 14px 0;
}
#wakelock-note.show { display: block; }
</style>
</head>
<body>

<div id="conn-banner"></div>

<!-- ── Start / PIN screen ─────────────────────────────── -->
<div id="start-screen">
  <div id="start-logo">n.</div>
  <div id="start-msg">Se verifică accesul…</div>
  <input id="pin-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="——————" style="display:none">
  <button id="start-btn" class="big-btn" style="display:none">Intră</button>
  <div id="start-error"></div>
</div>

<!-- ── Live grid ───────────────────────────────────────── -->
<div id="grid-screen">
  <div id="topbar">
    <div>
      <div id="tb-title">nota. Ospătar</div>
      <div id="tb-restaurant"></div>
    </div>
    <div id="tb-actions">
      <button id="lang-btn" class="tb-btn" type="button">RO</button>
      <button id="mute-btn" class="tb-btn" type="button">🔊</button>
    </div>
  </div>
  <div id="wakelock-note"></div>
  <div id="grid"></div>
  <div id="empty-state" style="display:none"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/waiter.js"></script>
</body>
</html>
