<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meniu — nota.</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #00333c; --secondary: #775a19; --bg: #f8f9fa; --surface: rgba(255,255,255,0.9);
  --on-surface: #191c1d; --on-sv: #40484a; --outline: #70787b; --brass: #C5A059;
  --radius: 0.75rem; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
html, body { font-family: 'Manrope', system-ui, sans-serif; background-color: var(--bg);
  color: var(--on-surface); -webkit-font-smoothing: antialiased; }
.col { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + var(--safe-b)); }

#hdr { position: sticky; top: 0; z-index: 100; background: rgba(248,249,250,0.94);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(197,160,89,0.22); padding: calc(12px + var(--safe-t)) 16px 10px; }
.hdr-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.hdr-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: var(--primary); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lang-toggle { background: rgba(197,160,89,0.12); border: 1px solid rgba(197,160,89,0.3); border-radius: 6px;
  padding: 5px 10px; font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700;
  color: var(--secondary); cursor: pointer; letter-spacing: 0.1em; }

#cat-nav { display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 4px; scrollbar-width: none; }
#cat-nav::-webkit-scrollbar { display: none; }
.cat-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(197,160,89,0.3);
  background: #fff; font-family: 'Manrope', sans-serif; font-size: 12.5px; font-weight: 600;
  color: var(--secondary); cursor: pointer; white-space: nowrap; }
.cat-tab.sel { background: var(--primary); color: #fff; border-color: var(--primary); }

.cat-section { padding-top: 22px; scroll-margin-top: 100px; }
.cat-title { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
.menu-item { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0;
  border-bottom: 1px solid rgba(197,160,89,0.16); }
.mi-name { font-weight: 700; font-size: 14.5px; color: var(--on-surface); }
.mi-desc { font-size: 12.5px; color: var(--on-sv); margin-top: 3px; line-height: 1.4; }
.mi-price { font-weight: 700; font-size: 14px; color: var(--primary); white-space: nowrap; flex-shrink: 0; }

.empty-msg { color: var(--outline); font-size: 13.5px; text-align: center; padding: 40px 16px; }

#pay-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  padding: 10px 16px calc(14px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 60%, rgba(248,249,250,0)); }
.pay-bar-inner { max-width: 560px; margin: 0 auto; }
.btn-pay { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  padding: 15px 20px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius);
  font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; text-decoration: none;
  box-shadow: 0 10px 24px rgba(0,51,60,0.22); }
</style>
</head>
<body>

<header id="hdr">
  <div class="hdr-inner">
    <div class="hdr-title" id="rname">nota.</div>
    <button class="lang-toggle" id="lang-btn">RU</button>
  </div>
  <nav id="cat-nav"></nav>
</header>

<main class="col" id="menu-body"></main>

<div id="pay-bar">
  <div class="pay-bar-inner">
    <a class="btn-pay" id="btn-pay" href="#">
      <span>💳</span><span id="pay-lbl" data-i18n="pay_bill">Plătește nota</span>
    </a>
  </div>
</div>

<script>
  const TRANS = {
    ro: { pay_bill: 'Plătește nota', empty: 'Meniul nu este încă disponibil.', loading: 'Se încarcă meniul…' },
    ru: { pay_bill: 'Оплатить счёт', empty: 'Меню пока недоступно.', loading: 'Загружаем меню…' },
  };
  let lang = localStorage.getItem('nota_lang') || 'ro';
  const t = key => TRANS[lang]?.[key] ?? TRANS.ro[key] ?? key;

  const token = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('btn-pay').href = `/bill?t=${encodeURIComponent(token)}`;

  let menuData = null;
  let lastUnpaidLei = 0;

  function localized(obj, roKey, ruKey) {
    if (lang === 'ru' && obj[ruKey]) return obj[ruKey];
    return obj[roKey];
  }

  function fmtMDL(n) { return Number(n).toFixed(0) + ' lei'; }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render() {
    document.getElementById('lang-btn').textContent = lang === 'ro' ? 'RU' : 'RO';
    const lbl = document.getElementById('pay-lbl');
    lbl.textContent = lastUnpaidLei > 0 ? `${t('pay_bill')} · ${Math.round(lastUnpaidLei)} lei` : t('pay_bill');
    if (!menuData) return;
    document.getElementById('rname').textContent = menuData.restaurantName;

    const cats = menuData.categories || [];
    if (!cats.length) {
      document.getElementById('menu-body').innerHTML = `<div class="empty-msg">${t('empty')}</div>`;
      document.getElementById('cat-nav').innerHTML = '';
      return;
    }

    document.getElementById('cat-nav').innerHTML = cats.map((c, i) =>
      `<button class="cat-tab ${i === 0 ? 'sel' : ''}" data-cat="cat-${i}">${esc(localized(c, 'name_ro', 'name_ru'))}</button>`
    ).join('');

    document.getElementById('menu-body').innerHTML = cats.map((c, i) => `
      <section class="cat-section" id="cat-${i}">
        <div class="cat-title">${esc(localized(c, 'name_ro', 'name_ru'))}</div>
        ${c.items.map(it => `
          <div class="menu-item">
            <div>
              <div class="mi-name">${esc(localized(it, 'name_ro', 'name_ru'))}</div>
              ${(localized(it, 'description_ro', 'description_ru') || '') ? `<div class="mi-desc">${esc(localized(it, 'description_ro', 'description_ru'))}</div>` : ''}
            </div>
            <div class="mi-price">${fmtMDL(it.price)}</div>
          </div>`).join('')}
      </section>
    `).join('');
  }

  document.getElementById('lang-btn').addEventListener('click', () => {
    lang = lang === 'ro' ? 'ru' : 'ro';
    localStorage.setItem('nota_lang', lang);
    render();
  });

  // CSP-safe delegated click handler (no inline onclick) — scrolls to the tapped category.
  document.getElementById('cat-nav').addEventListener('click', e => {
    const btn = e.target.closest('.cat-tab');
    if (!btn) return;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('sel', b === btn));
    document.getElementById(btn.dataset.cat)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  async function loadMenu() {
    document.getElementById('menu-body').innerHTML = `<div class="empty-msg">${t('loading')}</div>`;
    try {
      const res = await fetch(`/api/menu/by-token/${encodeURIComponent(token)}`);
      if (!res.ok) { location.href = `/bill?t=${encodeURIComponent(token)}`; return; }
      menuData = await res.json();
      render();
    } catch {
      document.getElementById('menu-body').innerHTML = `<div class="empty-msg">${t('empty')}</div>`;
    }
  }

  async function refreshUnpaidTotal() {
    try {
      const res = await fetch(`/api/table/by-token/${encodeURIComponent(token)}`);
      if (!res.ok) return;
      const order = await res.json();
      lastUnpaidLei = (order.items || [])
        .filter(i => i.status !== 'paid')
        .reduce((s, i) => s + Number(i.price), 0);
      const lbl = document.getElementById('pay-lbl');
      lbl.textContent = lastUnpaidLei > 0 ? `${t('pay_bill')} · ${Math.round(lastUnpaidLei)} lei` : t('pay_bill');
    } catch {}
  }

  loadMenu();
  refreshUnpaidTotal();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshUnpaidTotal(); });
</script>
</body>
</html>
