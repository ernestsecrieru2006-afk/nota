<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141412">
<title>nota. — Dashboard</title>
<style>
  :root {
    --bg:        #141412;
    --panel:     #1E1D1A;
    --border:    #2A2925;
    --surface:   #242320;
    --text:      #F0EDE6;
    --muted:     #7A7567;
    --muted2:    #4A4840;
    --gold:      #C8922A;
    --gold-soft: rgba(200,146,42,.12);
    --green:     #4ade80;
    --green-bg:  rgba(74,222,128,.1);
    --red:       #f87171;
    --red-bg:    rgba(248,113,113,.1);
    --amber:     #fbbf24;
    --amber-bg:  rgba(251,191,36,.1);
    --radius:    10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── login screen ──────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px;
    width: 100%;
    max-width: 380px;
  }
  .login-brand {
    font-size: 28px;
    font-weight: 800;
    color: var(--gold);
    letter-spacing: -.5px;
    margin-bottom: 8px;
  }
  .login-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--gold); }
  #login-btn {
    width: 100%;
    margin-top: 6px;
    padding: 13px;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .01em;
  }
  #login-btn:active { opacity: .85; }
  #login-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .login-register { margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted); }
  .login-register a { color: var(--gold); cursor: pointer; }

  /* ── register panel (toggle) ────────────────── */
  #register-extra { display: none; }

  /* ── dashboard ────────────────────────────────── */
  #dashboard { display: none; height: 100vh; overflow: hidden; }

  .dash-layout {
    height: 100%;
    display: grid;
    grid-template-columns: 220px 1fr 300px;
    grid-template-rows: 64px 1fr;
  }

  /* ── top bar ─────────────────────────────────── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 16px;
  }
  .top-brand { font-size: 20px; font-weight: 800; color: var(--gold); letter-spacing: -.5px; }
  .top-separator { width: 1px; height: 20px; background: var(--border); }
  .top-restaurant { font-size: 14px; font-weight: 600; color: var(--text); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--green);
    background: var(--green-bg); padding: 4px 10px; border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .logout-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); padding: 6px 12px; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--muted2); }

  /* ── left sidebar ─────────────────────────────── */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
  }
  .sidebar-label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px; padding: 0 4px;
  }

  /* stat cards in sidebar */
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .stat-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 4px; letter-spacing: -.5px; }
  .stat-value.gold { color: var(--gold); }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* top dishes */
  .dish-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .dish-row:last-child { border-bottom: none; }
  .dish-rank { font-size: 11px; color: var(--muted); width: 18px; flex-shrink: 0; }
  .dish-name { flex: 1; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dish-count { font-size: 12px; color: var(--muted); }

  /* ── main content ─────────────────────────────── */
  .main {
    overflow-y: auto;
    padding: 20px;
    background: var(--bg);
  }

  .main-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

  /* tables grid */
  #tables-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }

  .table-tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    cursor: default;
    transition: border-color .2s, background .2s;
  }
  .table-tile.active   { border-color: var(--amber); background: var(--amber-bg); }
  .table-tile.has-paid { border-color: var(--green); background: var(--green-bg); }
  .table-tile.empty    { opacity: .45; }

  .tile-num { font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .tile-icon { font-size: 20px; margin-bottom: 6px; }
  .tile-amount { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile-amount.zero { color: var(--muted2); font-size: 13px; }
  .tile-status { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .table-tile.active .tile-status { color: var(--amber); }
  .table-tile.has-paid .tile-status { color: var(--green); }

  /* hourly chart */
  .chart-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }
  .chart-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  #hourly-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 80px;
  }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar {
    width: 100%; border-radius: 4px 4px 0 0;
    background: var(--gold);
    opacity: .7;
    min-height: 3px;
    transition: height .4s ease;
  }
  .bar.active { opacity: 1; background: var(--gold); box-shadow: 0 0 8px var(--gold-soft); }
  .bar-label { font-size: 9px; color: var(--muted); }

  /* ── right panel: live feed ───────────────────── */
  .feed-panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .feed-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .feed-title { font-size: 13px; font-weight: 600; }
  .feed-count {
    font-size: 11px; background: var(--gold-soft);
    color: var(--gold); padding: 2px 8px; border-radius: 10px; font-weight: 600;
  }
  #payments-feed { overflow-y: auto; flex: 1; padding: 0 0 8px; }

  .payment-row {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } }
  .payment-row.new { background: rgba(200,146,42,.06); }

  .pay-icon {
    width: 34px; height: 34px;
    background: var(--gold-soft);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .pay-info { flex: 1; min-width: 0; }
  .pay-table { font-size: 13px; font-weight: 600; }
  .pay-time { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .pay-amount { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
  .pay-tip { font-size: 11px; color: var(--muted); text-align: right; }

  /* empty feed */
  .feed-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
  .feed-empty .icon { font-size: 32px; margin-bottom: 10px; }

  /* seed btn */
  #seed-btn {
    margin: 12px 20px;
    width: calc(100% - 40px);
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #seed-btn:hover { border-color: var(--muted2); color: var(--text); }

  /* ── toast ──────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: all .25s;
    z-index: 999;
    max-width: 300px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.success { border-color: var(--green); color: var(--green); }

  /* responsive */
  @media (max-width: 900px) {
    .dash-layout { grid-template-columns: 1fr 260px; grid-template-rows: 64px auto 1fr; }
    .sidebar { grid-column: 1 / -1; grid-row: 2; display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px; }
    .sidebar .divider { display: none; }
    .sidebar-label { display: none; }
    .stat-card { min-width: 140px; }
    .main { grid-column: 1; }
    .feed-panel { grid-column: 2; grid-row: 2 / 4; }
  }
  @media (max-width: 640px) {
    .dash-layout { grid-template-columns: 1fr; }
    .feed-panel { display: none; }
    .main { grid-column: 1; }
  }
</style>
</head>
<body>

<!-- ── LOGIN ──────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">nota.</div>
    <div class="login-sub">Panou de control restaurant</div>

    <div id="register-extra">
      <div class="field">
        <label>Nume restaurant</label>
        <input type="text" id="reg-name" placeholder="ex: Carmelo Ristorante">
      </div>
      <div class="field">
        <label>Număr mese</label>
        <input type="number" id="reg-tables" value="8" min="1" max="50">
      </div>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="email@restaurant.md" autocomplete="email">
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button id="login-btn">Intră în cont</button>
    <div id="login-error"></div>

    <div class="login-register">
      <span id="mode-text">Nu ai cont?</span>
      <a id="mode-toggle"> Înregistrează restaurantul</a>
    </div>
  </div>
</div>

<!-- ── DASHBOARD ──────────────────────────────────────── -->
<div id="dashboard">
  <div class="dash-layout">
    <!-- top bar -->
    <div class="topbar">
      <div class="top-brand">nota.</div>
      <div class="top-separator"></div>
      <div class="top-restaurant" id="rest-name">Restaurant</div>
      <div class="top-right">
        <div class="live-badge"><div class="live-dot"></div>Live</div>
        <button class="logout-btn" id="logout-btn">Ieși</button>
      </div>
    </div>

    <!-- sidebar -->
    <div class="sidebar">
      <div class="sidebar-label">Astăzi</div>

      <div class="stat-card">
        <div class="stat-label">Total încasat</div>
        <div class="stat-value gold" id="stat-total">0 lei</div>
        <div class="stat-sub" id="stat-count">0 plăți</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Bacșișuri</div>
        <div class="stat-value" id="stat-tips">0 lei</div>
      </div>

      <div class="divider"></div>
      <div class="sidebar-label">Top feluri (30 zile)</div>
      <div id="top-dishes">
        <div style="color:var(--muted);font-size:13px;">Se încarcă...</div>
      </div>
    </div>

    <!-- main -->
    <div class="main">
      <div class="main-label">Starea meselor</div>
      <div id="tables-grid"></div>

      <div class="chart-wrap">
        <div class="chart-title">Plăți pe ore — azi</div>
        <div id="hourly-chart"></div>
      </div>
    </div>

    <!-- feed -->
    <div class="feed-panel">
      <div class="feed-header">
        <div class="feed-title">Plăți recente</div>
        <div class="feed-count" id="feed-count">0</div>
      </div>
      <div id="payments-feed">
        <div class="feed-empty">
          <div class="icon">⏳</div>
          <div>Așteptăm prima plată...</div>
        </div>
      </div>
      <button id="seed-btn">+ Adaugă date demo</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── auth state ────────────────────────────────────────────────────────────────
let token      = localStorage.getItem('nota_token');
let restaurant = JSON.parse(localStorage.getItem('nota_restaurant') || 'null');
let loginMode  = 'login';
let paymentCount = 0;

// ── init ─────────────────────────────────────────────────────────────────────
if (token && restaurant) {
  showDashboard();
} else {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

// ── login / register ─────────────────────────────────────────────────────────
document.getElementById('mode-toggle').addEventListener('click', () => {
  loginMode = loginMode === 'login' ? 'register' : 'login';
  const isReg = loginMode === 'register';
  document.getElementById('register-extra').style.display = isReg ? 'block' : 'none';
  document.getElementById('login-btn').textContent = isReg ? 'Creează cont' : 'Intră în cont';
  document.getElementById('mode-text').textContent = isReg ? 'Ai deja cont?' : 'Nu ai cont?';
  document.getElementById('mode-toggle').textContent = isReg ? ' Conectează-te' : ' Înregistrează restaurantul';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-pass').autocomplete = isReg ? 'new-password' : 'current-password';
});

document.getElementById('login-btn').addEventListener('click', async () => {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const errEl    = document.getElementById('login-error');
  errEl.textContent = '';

  if (!email || !password) { errEl.textContent = 'Completează toate câmpurile.'; return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Se conectează...';

  try {
    let body = { email, password };
    let url  = '/api/auth/login';

    if (loginMode === 'register') {
      const name       = document.getElementById('reg-name').value.trim();
      const tableCount = parseInt(document.getElementById('reg-tables').value) || 8;
      if (!name) { errEl.textContent = 'Introdu numele restaurantului.'; return; }
      body = { name, email, password, tableCount };
      url  = '/api/auth/register';
    }

    const res  = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();

    if (!res.ok) { errEl.textContent = data.error || 'Eroare la autentificare.'; return; }

    token      = data.token;
    restaurant = data.restaurant;
    localStorage.setItem('nota_token', token);
    localStorage.setItem('nota_restaurant', JSON.stringify(restaurant));
    showDashboard();

  } catch (e) {
    errEl.textContent = 'Eroare de rețea. Încearcă din nou.';
  } finally {
    btn.disabled = false;
    btn.textContent = loginMode === 'register' ? 'Creează cont' : 'Intră în cont';
  }
});

document.getElementById('login-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('nota_token');
  localStorage.removeItem('nota_restaurant');
  location.reload();
});

// ── dashboard ─────────────────────────────────────────────────────────────────
let socket;

function showDashboard() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('rest-name').textContent = restaurant?.name || 'Restaurant';

  loadStats();
  loadTopDishes();
  loadTables();
  loadHourly();
  loadRecentPayments();
  connectSocket();
}

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(path, { headers: { Authorization: `Bearer ${token}` } });
  if (res.status === 401) { localStorage.clear(); location.reload(); }
  return res.json();
}

// ── stats ─────────────────────────────────────────────────────────────────────
async function loadStats() {
  const data = await api('/api/dashboard/stats');
  document.getElementById('stat-total').textContent = `${fmt(data.total_lei)} lei`;
  document.getElementById('stat-count').textContent = `${data.payment_count} plăți`;
  document.getElementById('stat-tips').textContent  = `${fmt(data.total_tips)} lei`;
}

// ── top dishes ────────────────────────────────────────────────────────────────
async function loadTopDishes() {
  const dishes = await api('/api/dashboard/top-dishes');
  const el = document.getElementById('top-dishes');
  if (!dishes.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;">Fără date încă.</div>'; return; }
  el.innerHTML = dishes.slice(0, 7).map((d, i) => `
    <div class="dish-row">
      <div class="dish-rank">${i + 1}</div>
      <div class="dish-name">${esc(d.name)}</div>
      <div class="dish-count">×${d.times_ordered}</div>
    </div>`).join('');
}

// ── tables ────────────────────────────────────────────────────────────────────
async function loadTables() {
  const tables = await api('/api/dashboard/tables');
  const grid   = document.getElementById('tables-grid');
  if (!tables.length) { grid.innerHTML = '<div style="color:var(--muted)">Nicio masă configurată.</div>'; return; }

  grid.innerHTML = tables.map(t => {
    const total    = Number(t.unpaid_lei);
    const hasPaid  = Number(t.paid) > 0;
    const hasItems = Number(t.available) > 0 || Number(t.claimed) > 0;
    const cls      = hasItems ? 'active' : hasPaid ? 'has-paid' : 'empty';
    const icon     = hasItems ? '🍽' : hasPaid ? '✓' : '○';
    const amtTxt   = total > 0 ? `${fmt(total)} lei` : '';
    const stTxt    = hasItems
      ? `${t.available} disp · ${t.claimed} sel`
      : hasPaid ? 'Achitat' : 'Liberă';
    return `
      <div class="table-tile ${cls}">
        <div class="tile-num">Masa ${t.number}</div>
        <div class="tile-icon">${icon}</div>
        <div class="tile-amount ${total === 0 ? 'zero' : ''}">${amtTxt || '—'}</div>
        <div class="tile-status">${stTxt}</div>
      </div>`;
  }).join('');
}

// ── hourly chart ──────────────────────────────────────────────────────────────
async function loadHourly() {
  const rows  = await api('/api/dashboard/hourly');
  const chart = document.getElementById('hourly-chart');
  const now   = new Date().getHours();

  // Fill all 24 hours
  const byHour = {};
  rows.forEach(r => { byHour[r.hour] = r.total_lei; });
  const max = Math.max(...Object.values(byHour), 1);

  chart.innerHTML = Array.from({ length: 24 }, (_, h) => {
    const val = byHour[h] || 0;
    const pct = Math.round((val / max) * 100);
    const isNow = h === now;
    return `
      <div class="bar-col">
        <div class="bar ${isNow ? 'active' : ''}" style="height:${Math.max(pct,2)}%"></div>
        <div class="bar-label">${h % 3 === 0 ? h : ''}</div>
      </div>`;
  }).join('');
}

// ── recent payments ───────────────────────────────────────────────────────────
async function loadRecentPayments() {
  const payments = await api('/api/dashboard/recent');
  paymentCount = payments.length;
  document.getElementById('feed-count').textContent = paymentCount;

  const feed = document.getElementById('payments-feed');
  if (!payments.length) {
    feed.innerHTML = `<div class="feed-empty"><div class="icon">⏳</div><div>Așteptăm prima plată...</div></div>`;
    return;
  }
  feed.innerHTML = payments.map(p => paymentRowHtml(p, false)).join('');
}

function paymentRowHtml(p, isNew) {
  const time = timeAgo(p.paid_at);
  const total = Number(p.amount_lei) + Number(p.tip_lei);
  return `
    <div class="payment-row ${isNew ? 'new' : ''}">
      <div class="pay-icon">💳</div>
      <div class="pay-info">
        <div class="pay-table">Masa ${p.table_number}</div>
        <div class="pay-time">${time}</div>
      </div>
      <div>
        <div class="pay-amount">${fmt(total)} lei</div>
        ${Number(p.tip_lei) > 0 ? `<div class="pay-tip">+${fmt(p.tip_lei)} bacșiș</div>` : ''}
      </div>
    </div>`;
}

// ── socket ────────────────────────────────────────────────────────────────────
function connectSocket() {
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    socket.emit('join-dashboard', { restaurantId: restaurant?.id });
  });

  socket.on('payment-made', p => {
    paymentCount++;
    document.getElementById('feed-count').textContent = paymentCount;

    const feed = document.getElementById('payments-feed');
    const emptyEl = feed.querySelector('.feed-empty');
    if (emptyEl) feed.innerHTML = '';

    const row = document.createElement('div');
    row.innerHTML = paymentRowHtml(p, true);
    feed.prepend(row.firstElementChild);

    // Update stats + chart without full reload
    loadStats();
    loadHourly();
    loadTables();

    toast(`💳 Masă ${p.table_number} — ${fmt(Number(p.amount_lei) + Number(p.tip_lei))} lei`, 'success');
  });

  socket.on('order-update', () => {
    loadTables();
  });
}

// ── seed ──────────────────────────────────────────────────────────────────────
document.getElementById('seed-btn').addEventListener('click', async () => {
  const btn = document.getElementById('seed-btn');
  btn.disabled = true;
  btn.textContent = 'Se adaugă...';
  try {
    await fetch('/api/dev/seed-payments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ restaurantId: restaurant?.id }),
    });
    await loadRecentPayments();
    await loadStats();
    await loadTopDishes();
    await loadHourly();
    await loadTables();
    toast('Date demo adăugate!', 'success');
  } catch {
    toast('Eroare la adăugarea datelor.');
  } finally {
    btn.disabled = false;
    btn.textContent = '+ Adaugă date demo';
  }
});

// ── utils ─────────────────────────────────────────────────────────────────────
function fmt(n) { return Math.round(Number(n)); }
function esc(s) { return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function timeAgo(ts) {
  const diff = Math.round((Date.now() - new Date(ts)) / 1000);
  if (diff < 60)  return 'Acum';
  if (diff < 3600) return `${Math.floor(diff/60)} min în urmă`;
  if (diff < 86400) return `${Math.floor(diff/3600)} ore în urmă`;
  return new Date(ts).toLocaleDateString('ro');
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 3500);
}
</script>
